# ==============================================================================
# QLACK-Java - SonarQube Scanner Configuration
#
# Replaces: mvn sonar:sonar -Dsonar.projectName=Qlack-Java ...
#
# IMPORTANT: sonar.projectKey is derived from the root pom.xml groupId:artifactId
# (com.eurodyn.qlack:qlack). This must not change — it is the identifier under
# which this project has already been analyzed in SonarQube.
# ==============================================================================

# --- Project identification ---
sonar.projectKey=com.eurodyn.qlack:qlack
sonar.projectName=Qlack-Java

sonar.sourceEncoding=UTF-8
sonar.java.source=21
sonar.working.directory=/tmp

# --- Dependencies (Maven local repo populated during the preceding build step) ---
sonar.java.libraries=/root/.m2/repository/**/*.jar

# --- Exclusions (mirroring sonar.exclusions from root pom.xml) ---
sonar.exclusions=**/generated-sources/**

# --- Coverage exclusions (mirroring sonar.coverage.exclusions from root pom.xml) ---
sonar.coverage.exclusions=\
  **/model/*,\
  **/model/**/*,\
  **/dto/*,\
  **/dto/**/*,\
  **/repository/*,\
  **/enums/*,\
  **/fuse/cm/util/JPAQueryUtil.java,\
  **/fuse/cm/storage/FSStorage.java,\
  **/fuse/rules/util/classloader/*,\
  **/util/clamav/util/*

# ==============================================================================
# Module declarations (flat list of all 28 leaf modules)
# Aggregator POMs — QLACK-Common (root), QLACK-Util, QLACK-Fuse — have no
# sources of their own and are intentionally omitted from this list.
# ==============================================================================
sonar.modules=\
  qlack-common,\
  qlack-util-jwt,\
  qlack-util-querydsl,\
  qlack-util-data,\
  qlack-util-data-mongo,\
  qlack-util-hibernate,\
  qlack-util-logger,\
  qlack-util-av-api,\
  qlack-util-clam-av,\
  qlack-util-fileutils,\
  qlack-util-documentation,\
  qlack-util-validation,\
  qlack-util-csrf,\
  qlack-fuse-aaa,\
  qlack-fuse-acv,\
  qlack-fuse-audit,\
  qlack-fuse-crypto,\
  qlack-fuse-content-manager,\
  qlack-fuse-fileupload,\
  qlack-fuse-imaging,\
  qlack-fuse-lexicon,\
  qlack-fuse-mailing,\
  qlack-fuse-rules,\
  qlack-fuse-scheduler,\
  qlack-fuse-settings,\
  qlack-fuse-workflow,\
  qlack-fuse-token-server,\
  qlack-fuse-feature-dashboard

# ==============================================================================
# QLACK-Common
# ==============================================================================
qlack-common.sonar.projectName=QLACK Common
qlack-common.sonar.projectBaseDir=QLACK-Common
qlack-common.sonar.sources=src/main/java
qlack-common.sonar.tests=src/test/java
qlack-common.sonar.java.binaries=target/classes
qlack-common.sonar.java.test.binaries=target/test-classes
qlack-common.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

